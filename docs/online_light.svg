<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img">
<title>Online learning mechanism</title>
<rect width="100%" height="100%" rx="8" fill="#fcfcfb"/>
<text x="24.0" y="38.0" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">Why online learning hurts: it learns to make harmless kicks</text>
<text x="24.0" y="62.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Static prior vs the same scorer updated during the run. The learner cuts its penalty by picking kicks that local search simply undoes.</text>
<text x="24.0" y="100.0" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Kick penalty (−reward)</text>
<text x="24.0" y="118.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">what the learner minimises</text>
<text x="24.0" y="162.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">static</text>
<rect x="74.0" y="146.0" width="172.0" height="24.0" rx="4" fill="#2a78d6"/>
<text x="252.0" y="163.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">25.9</text>
<text x="24.0" y="212.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">online</text>
<rect x="74.0" y="196.0" width="18.6" height="24.0" rx="4" fill="#eb6834"/>
<text x="98.6" y="213.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">2.8</text>
<text x="310.0" y="100.0" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Neutral kicks</text>
<text x="310.0" y="118.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">undone by local search</text>
<text x="310.0" y="162.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">static</text>
<rect x="360.0" y="146.0" width="92.1" height="24.0" rx="4" fill="#2a78d6"/>
<text x="458.1" y="163.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">47%</text>
<text x="310.0" y="212.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">online</text>
<rect x="360.0" y="196.0" width="172.0" height="24.0" rx="4" fill="#eb6834"/>
<text x="538.0" y="213.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">88%</text>
<text x="596.0" y="100.0" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Final gap (%)</text>
<text x="596.0" y="118.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">what we care about</text>
<text x="596.0" y="162.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">static</text>
<rect x="646.0" y="146.0" width="133.6" height="24.0" rx="4" fill="#2a78d6"/>
<text x="785.6" y="163.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">1.01</text>
<text x="596.0" y="212.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">online</text>
<rect x="646.0" y="196.0" width="172.0" height="24.0" rx="4" fill="#eb6834"/>
<text x="824.0" y="213.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">1.30</text>
<text x="24.0" y="262.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start">Penalty and neutral share: 12 development instances × 3 seeds (online higher on 12/12). Final gap: 54 held-out instances, preregistered test V1,</text>
<text x="24.0" y="278.0" font-size="11" font-weight="400" fill="#898781" text-anchor="start">+0.291 points, p = 1.6e−10. The learner&#x27;s pool drifts to short edges (cos(w₀, w_final) = −0.62).</text>
</svg>
